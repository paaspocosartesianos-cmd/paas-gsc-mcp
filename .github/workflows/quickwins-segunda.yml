name: PAAS Quick Wins SEO

on:
  schedule:
    # Toda segunda 11:00 UTC = 8:00 BRT (UTC-3)
    - cron: '0 11 * * 1'
  workflow_dispatch:  # permite disparo manual via aba Actions

permissions:
  contents: read
  issues: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run quick-wins script
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 cron/gsc-quickwins-cron.py

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quickwins-report
          path: |
            quick-wins-*.md
            gsc-raw-*.json
          retention-days: 60
